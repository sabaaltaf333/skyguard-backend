<!DOCTYPE html>
<html>
<head><title>SkyGuard Live Telemetry</title></head>
<body>
  <h2>Live Telemetry 📡</h2>
  <p>Status: <b id="status">Connecting...</b></p>
  <ul id="list"></ul>
  <script>
    const ws = new WebSocket("ws://127.0.0.1:8000/ws/telemetry");

    ws.onopen = () => {
      document.getElementById("status").textContent = "✅ Connected";
    };
    ws.onclose = () => {
      document.getElementById("status").textContent = "❌ Disconnected";
    };
    ws.onerror = () => {
      document.getElementById("status").textContent = "⚠️ Error (connection fail)";
    };
   ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const li = document.createElement("li");
      if (data.type === "alert") {
        li.textContent = "🚨 " + data.message;
        li.style.color = "red";
        li.style.fontWeight = "bold";
      } else {
        li.textContent = "📡 " + data.drone_id + " | pos(" + data.pos_x + "," + data.pos_y + ") | battery " + data.battery + "%";
      }
      document.getElementById("list").prepend(li);
    };
  </script>
</body>
</html>
